<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎉 Lucky Draw</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(circle at 20% 10%, #1e2a5a, #0b0f1f 60%);
    color: #eef2ff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px 60px;
  }

  .app {
    width: min(680px, 100%);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 32px;
    backdrop-filter: blur(12px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
  }

  header { text-align: center; }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(24px, 4vw, 34px);
    background: linear-gradient(135deg, #ffd76a, #ff9a3c 60%, #ff6b9d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    cursor: default;
    user-select: none;
  }

  .sub {
    margin: 0;
    color: #9aa8d0;
    font-size: 14px;
  }

  /* ---------- Display ---------- */
  .display {
    min-height: 170px;
    display: grid;
    place-items: center;
    margin: 26px 0;
    padding: 24px;
    text-align: center;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }

  #displayText {
    font-size: clamp(22px, 5vw, 40px);
    font-weight: 800;
    line-height: 1.25;
    word-break: break-word;
  }

  #displayText.rolling { opacity: 0.7; }

  #displayText.winner {
    color: #ffd76a;
    text-shadow: 0 0 30px rgba(255, 200, 80, 0.6);
    animation: pop 0.55s cubic-bezier(0.2, 1.6, 0.4, 1);
  }

  @keyframes pop {
    0%   { transform: scale(0.55); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* ---------- Buttons ---------- */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    font: inherit;
    font-weight: 700;
    border: none;
    cursor: pointer;
    border-radius: 14px;
    padding: 16px 42px;
    font-size: 18px;
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, #ffd76a, #ff9a3c);
    color: #2a1a00;
    box-shadow: 0 10px 30px rgba(255, 160, 60, 0.35);
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }

  button:hover:not(:disabled)  { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(255, 160, 60, 0.5); }
  button:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  button:disabled              { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

  /* ---------- Stats ---------- */
  .stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 22px;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8794bd;
  }

  /* ---------- Hidden Editor Panel ---------- */
  .editor {
    display: none;                /* hidden from normal users */
    margin-top: 28px;
    border-top: 1px dashed rgba(255, 215, 106, 0.35);
    padding-top: 22px;
    animation: editorReveal 0.25s ease;
  }

  .editor.visible { display: block; }

  @keyframes editorReveal {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .editor-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #ffd76a;
    margin-bottom: 14px;
    padding: 0 4px;
  }

  .editor-title .close-btn {
    all: unset;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    color: #8794bd;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.15s, color 0.15s;
  }
  .editor-title .close-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #eef2ff;
  }

  .edit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.07);
    margin-bottom: 8px;
  }

  .edit-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .edit-name {
    font-size: 15px;
    font-weight: 700;
    color: #eef2ff;
    word-break: break-word;
  }

  .edit-sub {
    font-size: 11px;
    letter-spacing: 0.05em;
    color: #8794bd;
    margin-top: 2px;
  }

  .qty-input {
    width: 84px;
    flex: none;
    padding: 9px 8px;
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(0, 0, 0, 0.35);
    color: #ffd76a;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .qty-input:focus {
    border-color: #ffd76a;
    box-shadow: 0 0 0 3px rgba(255, 215, 106, 0.18);
  }

  .editor-hint {
    margin: 6px 2px 0;
    font-size: 11px;
    color: #8794bd;
    letter-spacing: 0.04em;
  }

  /* ---------- Confetti ---------- */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1 id="appTitle">🎉 Lucky Draw</h1>
    <p class="sub">Press the button (or hit <strong>Space</strong>) to draw</p>
  </header>

  <div class="display">
    <span id="displayText">Ready?</span>
  </div>

  <div class="controls">
    <button id="drawBtn">DRAW</button>
  </div>

  <div class="stats">
    <span id="remainingEl">0 tickets left</span>
    <span id="drawnCountEl">0 drawn</span>
  </div>

  <!-- ---------- Hidden Editor Panel ---------- -->
  <div class="editor" id="editorPanel">
    <div class="editor-title">
      <span>⚙️ Pool Editor</span>
      <button class="close-btn" id="editorClose" type="button" aria-label="Close editor">✕</button>
    </div>
    <div id="editorList"></div>
    <p class="editor-hint">
      Changes apply immediately. Remaining = quantity − already drawn.
    </p>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
/* ==========================================================================
   ✏️  DEFAULT ITEMS (initial quantities)
   --------------------------------------------------------------------------
   Format:   "Item name": amount,

   The hidden editor panel lets you change these quantities live in the UI.
   These values are used once when the page loads.
   ========================================================================== */

const DEFAULT_ITEMS = {
  "枕頭":        3,
  "Totebag":     6,
  "Cap帽":       4,
  "HKU明信片":   20,
  "多謝參與!":   120
};

/* ==========================================================================
   ⬇️  You normally don't need to change anything below this line.
   ========================================================================== */

const displayText   = document.getElementById('displayText');
const drawBtn       = document.getElementById('drawBtn');
const remainingEl   = document.getElementById('remainingEl');
const drawnCountEl  = document.getElementById('drawnCountEl');
const editorPanel   = document.getElementById('editorPanel');
const editorList    = document.getElementById('editorList');
const editorClose   = document.getElementById('editorClose');
const appTitle      = document.getElementById('appTitle');

let startingPool = {};   // { name: total quantity }  ← editable via panel
let drawnCounts  = {};   // { name: how many times drawn }
let totalDrawn   = 0;
let drawing      = false;

/* ---------- Helpers ---------- */
const escapeHtml = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const remainingOf = (name) =>
  Math.max(0, (startingPool[name] || 0) - (drawnCounts[name] || 0));

const totalTickets = () =>
  Object.keys(startingPool).reduce((sum, n) => sum + remainingOf(n), 0);

/* ---------- Weighted random pick ---------- */
function pickWeighted() {
  const names = Object.keys(startingPool);
  const total = totalTickets();
  if (total <= 0) return null;

  let r = Math.random() * total;
  for (const name of names) {
    r -= remainingOf(name);
    if (r < 0) return name;
  }
  return names[names.length - 1];
}

/* ---------- Load initial pool ---------- */
function init() {
  startingPool = {};
  drawnCounts  = {};
  totalDrawn   = 0;
  drawing      = false;

  for (const [name, amount] of Object.entries(DEFAULT_ITEMS)) {
    const n = Math.max(0, Math.floor(Number(amount) || 0));
    if (n <= 0) continue;
    startingPool[name] = n;
    drawnCounts[name]  = 0;
  }

  displayText.className   = '';
  displayText.textContent = 'Ready?';

  renderEditor();
  renderStats();
}

/* ---------- Render stats (top area) ---------- */
function renderStats() {
  const left = totalTickets();
  remainingEl.textContent  = `${left} ticket${left === 1 ? '' : 's'} left`;
  drawnCountEl.textContent = `${totalDrawn} drawn`;

  drawBtn.disabled    = drawing || left === 0;
  drawBtn.textContent = left === 0 ? 'No tickets left' : 'DRAW';
}

/* ---------- Render pool editor panel ---------- */
function renderEditor() {
  const names = Object.keys(startingPool);
  if (names.length === 0) {
    editorList.innerHTML = '<p class="editor-hint">No items defined.</p>';
    return;
  }

  editorList.innerHTML = names.map((name) => {
    const total     = startingPool[name];
    const drawn     = drawnCounts[name] || 0;
    const remaining = remainingOf(name);
    return `
      <div class="edit-row">
        <div class="edit-info">
          <span class="edit-name">${escapeHtml(name)}</span>
          <span class="edit-sub">${remaining} left · ${drawn} drawn</span>
        </div>
        <input
          type="number"
          class="qty-input"
          min="0"
          step="1"
          value="${total}"
          data-name="${escapeHtml(name)}"
          aria-label="Quantity for ${escapeHtml(name)}"
        >
      </div>`;
  }).join('');
}

/* ---------- Editor events ---------- */
editorList.addEventListener('input', (e) => {
  const input = e.target.closest('.qty-input');
  if (!input) return;

  const name = input.dataset.name;
  const val  = Math.max(0, Math.floor(Number(input.value) || 0));

  startingPool[name] = val;

  const sub = input.parentElement.querySelector('.edit-sub');
  if (sub) {
    sub.textContent = `${remainingOf(name)} left · ${drawnCounts[name] || 0} drawn`;
  }

  renderStats();
});

editorList.addEventListener('blur', (e) => {
  const input = e.target.closest && e.target.closest('.qty-input');
  if (!input) return;
  const val = Math.max(0, Math.floor(Number(input.value) || 0));
  input.value = val;
  startingPool[input.dataset.name] = val;
  renderStats();
}, true);

/* ---------- Show / hide editor panel ---------- */
function showEditor()  { editorPanel.classList.add('visible'); }
function hideEditor()  { editorPanel.classList.remove('visible'); }
function toggleEditor(){ editorPanel.classList.toggle('visible'); }

editorClose.addEventListener('click', hideEditor);

/* Secret 1: Ctrl + Shift + E (Cmd + Shift + E on Mac) */
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'E' || e.key === 'e')) {
    e.preventDefault();
    toggleEditor();
  }
});

/* Secret 2: triple-click the title */
let titleClicks = 0;
let titleTimer  = null;
appTitle.addEventListener('click', () => {
  titleClicks++;
  clearTimeout(titleTimer);
  if (titleClicks >= 3) {
    titleClicks = 0;
    toggleEditor();
    return;
  }
  titleTimer = setTimeout(() => { titleClicks = 0; }, 600);
});

/* ---------- The Draw ---------- */
function draw() {
  if (drawing || totalTickets() === 0) return;

  drawing = true;
  renderStats();

  const winner = pickWeighted();

  displayText.className = 'rolling';

  const TOTAL_MS = 1200;
  let elapsed = 0;

  function step() {
    if (elapsed >= TOTAL_MS) {
      finish(winner);
      return;
    }
    displayText.textContent = pickWeighted() || winner;

    const p = elapsed / TOTAL_MS;
    const delay = 45 + 280 * p * p;
    elapsed += delay;
    setTimeout(step, delay);
  }

  step();
}

function finish(winner) {
  displayText.textContent = winner;
  displayText.className   = 'winner';

  drawnCounts[winner] = (drawnCounts[winner] || 0) + 1;
  totalDrawn += 1;
  drawing = false;

  editorList.querySelectorAll('.edit-row').forEach((row) => {
    const input = row.querySelector('.qty-input');
    if (!input) return;
    const name = input.dataset.name;
    const sub  = row.querySelector('.edit-sub');
    if (sub) {
      sub.textContent = `${remainingOf(name)} left · ${drawnCounts[name] || 0} drawn`;
    }
  });

  renderStats();
  burstConfetti();
}

/* ---------- Confetti ---------- */
const canvas = document.getElementById('confetti');
const ctx    = canvas.getContext('2d');
let particles = [];
let rafId = null;

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function burstConfetti() {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight * 0.35;

  for (let i = 0; i < 90; i++) {
    particles.push({
      x: cx,
      y: cy,
      vx: (Math.random() - 0.5) * 14,
      vy: Math.random() * -13 - 3,
      size: Math.random() * 7 + 4,
      color: `hsl(${Math.random() * 360}, 90%, 62%)`,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.35,
      life: 1
    });
  }

  if (!rafId) rafId = requestAnimationFrame(updateConfetti);
}

function updateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const p of particles) {
    p.vy += 0.38;
    p.x  += p.vx;
    p.y  += p.vy;
    p.rot += p.vr;
    p.life -= 0.008;
  }

  particles = particles.filter((p) => p.life > 0 && p.y < canvas.height + 60);

  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.62);
    ctx.restore();
  }

  if (particles.length) {
    rafId = requestAnimationFrame(updateConfetti);
  } else {
    rafId = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

/* ---------- Events ---------- */
drawBtn.addEventListener('click', draw);

window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  if (document.activeElement && document.activeElement.classList.contains('qty-input')) return;
  e.preventDefault();
  draw();
});

/* ---------- Go! ---------- */
init();
</script>
</body>
</html>
